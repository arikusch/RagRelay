<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="rm-title rm-desc">
  <title id="rm-title">ragrelay routing map</title>
  <desc id="rm-desc">A transit-map diagram. Two queries enter on the left and travel red transactional lanes and blue semantic lanes through a central scorer interchange, then split to three regional endpoint stations on the right. Moving markers show retrieval attempts flowing along each route.</desc>

  <rect width="760" height="380" fill="#0d1017"/>

  <text x="28" y="40" fill="#f2f4f8" font-family="Consolas,Menlo,monospace" font-size="19" font-weight="700">ragrelay route map</text>
  <text x="28" y="60" fill="#9aa6bd" font-family="Consolas,Menlo,monospace" font-size="12">queries &#8594; scorer &#8594; endpoints by region</text>

  <!-- score blend legend -->
  <g font-family="Consolas,Menlo,monospace" font-size="10.5" fill="#9aa6bd">
    <text x="470" y="44">affinity = 0.5 cosine + 0.3 topic + 0.2 latency</text>
    <text x="470" y="60">ranked desc, ties on id, split by capacity</text>
  </g>

  <!-- Lanes -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- red transactional trunk -->
    <path id="lineRed" d="M130,150 L320,150 L430,200 L650,120" stroke="#d83a45" stroke-width="7"/>
    <!-- red branch to compliance/audit at eu -->
    <path id="lineRed2" d="M320,150 L460,110 L650,120" stroke="#d83a45" stroke-width="4" opacity="0.55"/>
    <!-- blue semantic trunk -->
    <path id="lineBlue" d="M130,250 L320,250 L430,200 L650,280" stroke="#2f7dd1" stroke-width="7"/>
    <!-- blue branch to ap embeddings -->
    <path id="lineBlue2" d="M320,250 L470,300 L650,340" stroke="#2f7dd1" stroke-width="4" opacity="0.55"/>
  </g>

  <!-- scorer interchange -->
  <rect x="410" y="180" width="40" height="40" rx="4" fill="#0d1017" stroke="#e8b23a" stroke-width="3"/>
  <text x="430" y="205" fill="#e8b23a" font-family="Consolas,Menlo,monospace" font-size="10" text-anchor="middle">score</text>
  <rect x="405" y="175" width="50" height="50" rx="6" fill="none" stroke="#e8b23a" stroke-width="2" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.15;0.7" dur="2.6s" repeatCount="indefinite"/>
  </rect>

  <!-- stations -->
  <g font-family="Consolas,Menlo,monospace" font-size="11.5">
    <!-- query origins -->
    <circle cx="130" cy="150" r="9" fill="#0d1017" stroke="#d83a45" stroke-width="3"/>
    <text x="30" y="154" fill="#f2f4f8">q-invoice</text>
    <circle cx="130" cy="250" r="9" fill="#0d1017" stroke="#2f7dd1" stroke-width="3"/>
    <text x="34" y="254" fill="#f2f4f8">q-lookup</text>

    <!-- region endpoints -->
    <circle cx="650" cy="120" r="10" fill="#0d1017" stroke="#d83a45" stroke-width="3"/>
    <text x="666" y="124" fill="#f2f4f8">eu-west</text>
    <circle cx="650" cy="200" r="10" fill="#0d1017" stroke="#c9d2e2" stroke-width="3"/>
    <text x="666" y="204" fill="#f2f4f8">us-east</text>
    <circle cx="650" cy="280" r="10" fill="#0d1017" stroke="#2f7dd1" stroke-width="3"/>
    <text x="666" y="284" fill="#f2f4f8">ap-south</text>
    <circle cx="650" cy="340" r="8" fill="#0d1017" stroke="#2f7dd1" stroke-width="2" opacity="0.7"/>
    <text x="666" y="344" fill="#9aa6bd">w-navy</text>
  </g>

  <!-- attempt markers on the trunks -->
  <circle r="5" fill="#ff5b66">
    <animateMotion dur="3.2s" repeatCount="indefinite"><mpath href="#lineRed"/></animateMotion>
  </circle>
  <circle r="4" fill="#ff8a92">
    <animateMotion dur="3.2s" begin="1.1s" repeatCount="indefinite"><mpath href="#lineRed"/></animateMotion>
