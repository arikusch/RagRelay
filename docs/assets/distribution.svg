<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="dm-title dm-desc">
  <title id="dm-title">ragrelay distribution monitor</title>
  <desc id="dm-desc">A horizontal bar chart of how retrieval attempts distribute across five worker endpoints in the bundled fixture, colored on the red-to-blue transit palette, with a latency indicator that sweeps left to right beneath the bars.</desc>

  <rect width="760" height="380" fill="#0d1017"/>

  <text x="28" y="40" fill="#f2f4f8" font-family="Consolas,Menlo,monospace" font-size="19" font-weight="700">ragrelay distribution</text>
  <text x="28" y="60" fill="#9aa6bd" font-family="Consolas,Menlo,monospace" font-size="12">attempts per endpoint, fanout=3, sample run</text>

  <!-- axes -->
  <line x1="150" y1="90" x2="150" y2="310" stroke="#3a465f" stroke-width="1.5"/>
  <line x1="150" y1="310" x2="700" y2="310" stroke="#3a465f" stroke-width="1.5"/>

  <!-- gridline ticks with percent labels -->
  <g stroke="#232c3d" stroke-width="1" font-family="Consolas,Menlo,monospace" font-size="9" fill="#6f7c95">
    <line x1="290" y1="90" x2="290" y2="310"/>
    <text x="278" y="326">10%</text>
    <line x1="430" y1="90" x2="430" y2="310"/>
    <text x="418" y="326">20%</text>
    <line x1="570" y1="90" x2="570" y2="310"/>
    <text x="558" y="326">30%</text>
  </g>

  <!-- bars: widths map to sample distribution (26.3, 21.1, 21.1, 15.8, 15.8 percent) -->
  <g font-family="Consolas,Menlo,monospace" font-size="11.5" fill="#c9d2e2">
    <text x="140" y="118" text-anchor="end">w-crimson</text>
    <rect x="150" y="106" height="20" rx="2" fill="#d83a45">
      <animate attributeName="width" values="0;368;368" keyTimes="0;0.85;1" dur="2.4s" begin="0s" fill="freeze"/>
    </rect>
    <text x="526" y="121" fill="#f2f4f8">26.3%</text>

    <text x="140" y="156" text-anchor="end">w-scarlet</text>
    <rect x="150" y="144" height="20" rx="2" fill="#c95560">
      <animate attributeName="width" values="0;295;295" keyTimes="0;0.85;1" dur="2.4s" begin="0.15s" fill="freeze"/>
    </rect>
    <text x="453" y="159" fill="#f2f4f8">21.1%</text>

    <text x="140" y="194" text-anchor="end">w-azure</text>
    <rect x="150" y="182" height="20" rx="2" fill="#7d6bc4">
      <animate attributeName="width" values="0;295;295" keyTimes="0;0.85;1" dur="2.4s" begin="0.3s" fill="freeze"/>
    </rect>
    <text x="453" y="197" fill="#f2f4f8">21.1%</text>

    <text x="140" y="232" text-anchor="end">w-cobalt</text>
    <rect x="150" y="220" height="20" rx="2" fill="#3f7fce">
      <animate attributeName="width" values="0;221;221" keyTimes="0;0.85;1" dur="2.4s" begin="0.45s" fill="freeze"/>
    </rect>
    <text x="379" y="235" fill="#f2f4f8">15.8%</text>
