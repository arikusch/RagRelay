[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragrelay"
version = "5.0.2"
description = "Deterministic retrieval-routing simulator with query/worker scoring and run manifests"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Julian Frost", email = "32219062+jfrost4@users.noreply.github.com" }]
keywords = ["routing", "retrieval", "simulator", "rag", "load-balancing"]

[project.scripts]
ragrelay = "ragrelay.cli:main"

