name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile package
        run: python -m compileall ragrelay
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run tests
        run: python -m pytest tests/ -o addopts=""
      - name: Smoke-run CLI
        run: |
          python -m ragrelay score examples/profiles.json
          python -m ragrelay route examples/profiles.json
          python -m ragrelay simulate examples/profiles.json
          python -m ragrelay manifest examples/profiles.json

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build and vet
        working-directory: relay
        run: |
          go build ./...
          go vet ./...
      - name: Smoke-run scorer
        working-directory: relay
        run: go run . -in ../examples/profiles.json -top 2
